[package]
org = "ballerina"
name = "protobuf"
version = "1.8.1"
authors = ["Ballerina"]
keywords = ["wrappers"]
repository = "https://github.com/ballerina-platform/module-ballerina-protobuf"
icon = "icon.png"
license = ["Apache-2.0"]
distribution = "2201.14.0-SNAPSHOT"

[[package.modules]]
name="protobuf.types.any"
export=true

[[package.modules]]
name="protobuf.types.duration"
export=true

[[package.modules]]
name="protobuf.types.empty"
export=true

[[package.modules]]
name="protobuf.types.struct"
export=true

[[package.modules]]
name="protobuf.types.timestamp"
export=true

[[package.modules]]
name="protobuf.types.wrappers"
export=true

[platform.java25]
graalvmCompatible = true

[[platform.java25.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "protobuf-native"
version = "1.8.1"
path = "../native/build/libs/protobuf-native-1.8.1-SNAPSHOT.jar"

[[platform.java25.dependency]]
groupId = "com.google.protobuf"
artifactId = "protobuf-java"
version = "3.25.5"
path = "./lib/protobuf-java-3.25.5.jar"
